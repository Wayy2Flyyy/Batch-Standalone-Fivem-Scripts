services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: danielilli-scripts:latest
    container_name: danielilli-scripts
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SCRIPTS_DIR: /app/scripts
      MAX_EXEC_TIME: 30
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # Optional: mount extra scripts from host
      - scripts_data:/app/scripts
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  scripts_data:
    driver: local
