<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danielilli Scripts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__logo">⚡</span>
      <span class="sidebar__title">Danielilli<br><strong>Scripts</strong></span>
    </div>
    <nav class="sidebar__nav">
      <a href="#" class="sidebar__link sidebar__link--active" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="#" class="sidebar__link" data-view="scripts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        Scripts
      </a>
      <a href="#" class="sidebar__link" data-view="logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Run Logs
      </a>
    </nav>
    <div class="sidebar__footer">
      <div id="health-indicator" class="health health--unknown">
        <span class="health__dot"></span>
        <span class="health__label">Checking…</span>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main">
    <!-- Header -->
    <header class="topbar">
      <div class="topbar__left">
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="topbar__heading" id="view-title">Dashboard</h1>
      </div>
      <div class="topbar__right">
        <button class="btn btn--ghost btn--sm" id="refresh-btn" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Refresh
        </button>
      </div>
    </header>

    <!-- Views -->
    <div class="content">
      <!-- Dashboard view -->
      <section class="view" id="view-dashboard">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--blue">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            </div>
            <div class="stat-card__body">
              <p class="stat-card__label">Total Scripts</p>
              <p class="stat-card__value" id="stat-total">—</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--green">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <div class="stat-card__body">
              <p class="stat-card__label">Successful Runs</p>
              <p class="stat-card__value" id="stat-success">—</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--red">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            </div>
            <div class="stat-card__body">
              <p class="stat-card__label">Failed Runs</p>
              <p class="stat-card__value" id="stat-failed">—</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card__icon stat-card__icon--purple">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="stat-card__body">
              <p class="stat-card__label">Avg Duration</p>
              <p class="stat-card__value" id="stat-avg-duration">—</p>
            </div>
          </div>
        </div>

        <div class="section-header">
          <h2 class="section-title">Recent Activity</h2>
        </div>
        <div id="recent-logs" class="log-list log-list--empty">
          <p class="empty-state">No runs yet. Go to <strong>Scripts</strong> to execute one.</p>
        </div>
      </section>

      <!-- Scripts view -->
      <section class="view hidden" id="view-scripts">
        <div class="toolbar">
          <input type="text" class="search-input" id="search-input" placeholder="Search scripts…" />
          <div class="filter-group">
            <button class="filter-btn filter-btn--active" data-lang="all">All</button>
            <button class="filter-btn" data-lang="sh">Bash</button>
            <button class="filter-btn" data-lang="py">Python</button>
            <button class="filter-btn" data-lang="js">Node</button>
          </div>
        </div>
        <div id="scripts-grid" class="scripts-grid">
          <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Loading scripts…</p>
          </div>
        </div>
      </section>

      <!-- Logs view -->
      <section class="view hidden" id="view-logs">
        <div class="section-header">
          <h2 class="section-title">All Run Logs</h2>
          <button class="btn btn--ghost btn--sm" id="clear-logs-btn">Clear Logs</button>
        </div>
        <div id="all-logs" class="log-list log-list--empty">
          <p class="empty-state">No run history yet.</p>
        </div>
      </section>
    </div>
  </main>

  <!-- Script detail modal -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal__header">
        <h2 class="modal__title" id="modal-title">Script</h2>
        <button class="modal__close" id="modal-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal__body">
        <div class="modal__meta" id="modal-meta"></div>
        <div class="code-block">
          <div class="code-block__header">
            <span id="modal-lang-label"></span>
            <button class="btn btn--ghost btn--xs" id="copy-btn">Copy</button>
          </div>
          <pre class="code-block__pre" id="modal-code"></pre>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--ghost" id="modal-close-btn">Close</button>
        <button class="btn btn--primary" id="run-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Run Script
        </button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
