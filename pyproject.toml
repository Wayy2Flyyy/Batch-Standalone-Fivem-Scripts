[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danielilli-scripts"
version = "0.1.0"
description = "Deployment-ready starter for standalone Python scripts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Danielilli Scripts Team" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[project.scripts]
danielilli-scripts = "danielilli_scripts.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
