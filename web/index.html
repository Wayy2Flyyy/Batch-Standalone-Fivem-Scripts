<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danielilli Scripts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shell">
        <main class="panel" data-panel aria-live="polite">
            <section class="hero">
                <p class="eyebrow">Standalone FiveM Resource</p>
                <h1 data-title>Danielilli Scripts</h1>
                <p class="lead" data-subtitle>Modern visual UI, unique, and easy to install.</p>
            </section>

            <section class="actions" data-actions></section>

            <section class="status">
                <article class="status-card">
                    <span class="label">Resource</span>
                    <span class="value online" data-resource-name>Ready</span>
                </article>
                <article class="status-card">
                    <span class="label">Command</span>
                    <span class="value" data-command>/dsui</span>
                </article>
                <article class="status-card">
                    <span class="label">Status</span>
                    <span class="value online" data-status-text>Online</span>
                </article>
            </section>

            <button class="secondary close-button" data-action="close" type="button">Close panel</button>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
