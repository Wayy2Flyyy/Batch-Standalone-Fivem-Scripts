<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dani HUD</title>
</head>
<body>
    <div id="hud-container">
        <div class="bar-wrapper" id="health-bar-wrapper">
            <div class="bar-icon">&#10010;</div>
            <div class="bar-track">
                <div class="bar-fill" id="health-bar"></div>
            </div>
        </div>
        <div class="bar-wrapper" id="armor-bar-wrapper">
            <div class="bar-icon">&#9748;</div>
            <div class="bar-track">
                <div class="bar-fill" id="armor-bar"></div>
            </div>
        </div>
        <div class="bar-wrapper" id="stamina-bar-wrapper">
            <div class="bar-icon">&#9889;</div>
            <div class="bar-track">
                <div class="bar-fill" id="stamina-bar"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
